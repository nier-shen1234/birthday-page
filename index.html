<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mummy!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <!-- Re-engineered Cake Display -->
        <div class="cake-display">
            <div class="cake">
                <!-- Golden Candle -->
                <div class="candle">
                    <div class="flame"></div>
                </div>
                
                <!-- Cake Body -->
                <div class="cake-top">
                    <!-- Frosting drips -->
                    <div class="drips">
                        <div class="drip"></div>
                        <div class="drip"></div>
                        <div class="drip"></div>
                        <div class="drip"></div>
                        <div class="drip"></div>
                    </div>
                </div>
                <div class="cake-middle-cream"></div>
                <div class="cake-bottom"></div>
            </div>
            <!-- Glass Cake Stand -->
            <div class="cake-stand"></div>
        </div>

        <!-- Greeting Section -->
        <div class="container">
            <h1>Happy Birthday! 🎉</h1>
            <h1>สุขสันต์วันเกิดแม่</h1>
            <h1>生日快乐!</h1>
            
            <div class="gift-box" onclick="showMessage()">
                🎁 <span>Click to see message!</span>
            </div>

            <p id="surprise-message" class="hidden">
                I wish mummy a wonderful birthday.<br>
                ขอให้แม่มีความสุขมาก สุขภาพแข็งแรง และสมหวังในทุกๆ เรื่องครับ.<br>
                祝妈妈生日快乐，身体健康，心想事成!<br>
                รักแม่นะครับ<br>
            </p>
        </div>0
    </div>

    <!-- Hidden Streaming Music Player -->
    <audio id="birthday-audio" src="happy-birthday.mp3" autoplay loop></audio>

    <script src="script.js"></script>
</body>
</html>
